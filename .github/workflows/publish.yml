name: Stage npm release

on:
  push:
    branches: [main]
    paths:
      - apps/server/package.json
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-stage-main
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Typecheck
        run: bun run check-types
        working-directory: .

      - name: Test
        run: bun run --filter '*' test
        working-directory: .

      - name: Build
        run: bun run build
        working-directory: .

      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHOULD_STAGE=true

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            BEFORE='${{ github.event.before }}'
            if [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              BEFORE_VERSION=$(git show "$BEFORE:apps/server/package.json" 2>/dev/null \
                | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => { try { process.stdout.write(JSON.parse(s).version ?? "") } catch {} })')
              if [[ "$BEFORE_VERSION" == "$VERSION" ]]; then
                SHOULD_STAGE=false
              fi
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "should_stage=$SHOULD_STAGE" >> "$GITHUB_OUTPUT"
          echo "Release version: rce-mcp@$VERSION"

      - name: Stage package on npm
        if: steps.version.outputs.should_stage == 'true'
        run: npm stage publish . --access public

      - name: Write approval instructions
        if: steps.version.outputs.should_stage == 'true'
        run: |
          {
            echo "### rce-mcp@${{ steps.version.outputs.version }} staged"
            echo
            echo "Approve it with 2FA from npm's Staged Packages UI or with \`npm stage approve <stage-id>\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Note unchanged version
        if: steps.version.outputs.should_stage != 'true'
        run: echo "Package version is unchanged; nothing was staged." >> "$GITHUB_STEP_SUMMARY"
